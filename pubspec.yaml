name: sham_booking
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  bloc: ^9.2.1
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  get_it: ^9.2.1
  go_router: ^17.2.3
  get_storage: ^2.1.1
  internet_connection_checker: ^3.0.1
  logger: ^2.7.0
  meta: ^1.17.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.15.0
  very_good_analysis: ^10.2.0
  test: ^1.30.0
  flutter_flavorizr: ^2.4.2

flutter:
  uses-material-design: true

flavorizr:
  ide: "idea"
  app:
    android:
      flavorDimensions: "default"
    ios:
      bundleId: "com.example.shambooking"
  flavors:
    development:
      app:
        name: "ShamBooking_Development"
      android:
        applicationId: "com.example.shambooking.dev"
      ios:
        bundleId: "com.example.shambooking.dev"
    production:
      app:
        name: "ShamBooking_Production"
      android:
        applicationId: "com.example.shambooking.prod"
      ios:
        bundleId: "com.example.shambooking.prod"
